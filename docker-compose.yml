name: synapse

services:
  postgres:
    image: postgres:16-alpine
    container_name: synapse-postgres
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse_dev}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  vectordb:
    image: pgvector/pgvector:pg16
    container_name: synapse-vectordb
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: ${VECTOR_POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${VECTOR_POSTGRES_PASSWORD:-synapse_dev}
      POSTGRES_DB: ${VECTOR_POSTGRES_DB:-synapse_vectors}
    volumes:
      - vector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse -d synapse_vectors']
      interval: 5s
      timeout: 3s
      retries: 5

  core-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: synapse-core-service:latest
    container_name: synapse-core-service
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://synapse:synapse_dev@postgres:5432/synapse}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-minimum-32-characters-dev-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-jwt-key-minimum-32-characters-dev}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-internal-gateway-key-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npm run migrate && npm run seed && npm run dev"

  job-service:
    build:
      context: ./job-service
      dockerfile: Dockerfile
    image: synapse-job-service:latest
    container_name: synapse-job-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://synapse:synapse_dev@postgres:5432/synapse}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-service:
        condition: service_started
    volumes:
      - ./job-service:/app
      - /app/node_modules
    command: npm run dev

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    image: synapse-recommendation-service:latest
    container_name: synapse-recommendation-service
    ports:
      - '127.0.0.1:5001:5000'
    environment:
      PORT: 5000
      CORE_SERVICE_URL: http://core-service:4000
      VECTOR_DATABASE_URL: ${VECTOR_DATABASE_URL:-postgresql://synapse:synapse_dev@vectordb:5432/synapse_vectors}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-internal-gateway-key-32-chars}
    depends_on:
      vectordb:
        condition: service_healthy
      core-service:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./recommendation-service:/app

  chat-service-1:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    image: synapse-chat-service:latest
    container_name: synapse-chat-service-1
    ports:
      - '127.0.0.1:4001:4001'
    environment:
      PORT: 4001
      INSTANCE_ID: chat-1
      DATABASE_URL: ${DATABASE_URL:-postgresql://synapse:synapse_dev@postgres:5432/synapse}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-minimum-32-characters-dev-key}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-internal-gateway-key-32-chars}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./chat-service:/app
      - /app/node_modules
    command: npm run dev

  chat-service-2:
    image: synapse-chat-service:latest
    container_name: synapse-chat-service-2
    ports:
      - '127.0.0.1:4002:4002'
    environment:
      PORT: 4002
      INSTANCE_ID: chat-2
      DATABASE_URL: ${DATABASE_URL:-postgresql://synapse:synapse_dev@postgres:5432/synapse}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-minimum-32-characters-dev-key}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-internal-gateway-key-32-chars}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      chat-service-1:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./chat-service:/app
      - /app/node_modules
    command: npm run dev

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: synapse-gateway:latest
    container_name: synapse-gateway
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      CORE_SERVICE_URL: http://core-service:4000
      REC_SERVICE_URL: http://recommendation-service:5000
      CHAT_SERVICE_URLS: http://chat-service-1:4001,http://chat-service-2:4002
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-minimum-32-characters-dev-key}
      GATEWAY_SECRET: ${GATEWAY_SECRET:-super-secret-internal-gateway-key-32-chars}
    depends_on:
      - core-service
      - recommendation-service
      - chat-service-1
      - chat-service-2
    volumes:
      - ./gateway:/app
      - /app/node_modules
    command: npm run dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: synapse-client:latest
    container_name: synapse-client
    ports:
      - '80:80'
    environment:
      VITE_API_URL: http://gateway:3001
    depends_on:
      - gateway
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
  vector_pgdata:
